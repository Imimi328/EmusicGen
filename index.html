<!DOCTYPE html>
<html>
<head>
    <title>ACE-Step Studio</title>

    <style>
        body{
            margin:0;
            background:#0f0f0f;
            color:white;
            font-family:Arial, Helvetica, sans-serif;
            padding:30px;
        }

        h1{
            margin-bottom:20px;
        }

        textarea{
            width:100%;
            height:90px;
            background:#1a1a1a;
            border:1px solid #333;
            color:white;
            padding:10px;
            margin-bottom:10px;
            resize:vertical;
        }

        button{
            padding:12px 18px;
            margin-top:10px;
            background:#4CAF50;
            border:none;
            color:white;
            cursor:pointer;
            font-weight:bold;
        }

        .toggle{
            margin:10px 0;
        }

        .card{
            margin-top:20px;
            padding:15px;
            background:#1a1a1a;
            border-radius:8px;
            border:1px solid #2a2a2a;
        }

        .skeleton{
            height:20px;
            background:linear-gradient(90deg,#222,#333,#222);
            background-size:200% 100%;
            animation:shine 1.2s infinite;
            margin-bottom:10px;
            border-radius:4px;
        }

        @keyframes shine{
            0%{background-position:200% 0;}
            100%{background-position:-200% 0;}
        }

        audio{
            width:100%;
            margin-top:10px;
        }

        .badge{
            font-size:12px;
            padding:4px 8px;
            background:#333;
            border-radius:4px;
            display:inline-block;
            margin-bottom:10px;
        }
    </style>
</head>

<body>

<h1>🎵 ACE-Step Studio</h1>

<textarea id="prompt" placeholder="Describe your music style..."></textarea>

<textarea id="lyrics" placeholder="Paste lyrics here (optional)..."></textarea>

<div class="toggle">
    <label>
        <input type="checkbox" id="useLLM">
        Smart Mode (AI planning & enhancement)
    </label>
</div>

<button onclick="generate()">Generate Music</button>

<div id="results"></div>

<script>
const API = "https://emusic.emogi.space";

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function generate(){

    const prompt = document.getElementById("prompt").value.trim();
    const lyrics = document.getElementById("lyrics").value.trim();
    const useLLM = document.getElementById("useLLM").checked;

    if(!prompt){
        alert("Please enter a music description.");
        return;
    }

    const results = document.getElementById("results");

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
        <div class="badge">${useLLM ? "🧠 Smart Mode" : "🎤 Exact Lyrics Mode"}</div>
        <div class="skeleton" style="width:60%"></div>
        <div class="skeleton" style="width:90%"></div>
        <div class="skeleton" style="width:40%"></div>
    `;

    results.prepend(card);

    // ========= PAYLOAD =========
    const payload = {
        prompt: prompt,
        lyrics: lyrics,
        num_samples: 1   // IMPORTANT → only one song
    };

    if(useLLM){
        payload.thinking = true;
        payload.use_cot_caption = true;
        payload.use_cot_language = true;
        payload.use_format = true;
        payload.sample_mode = true;
    } else {
        payload.thinking = false;
        payload.use_cot_caption = false;
        payload.use_cot_language = false;
        payload.use_format = false;
        payload.sample_mode = false;
    }

    try{
        const r = await fetch(API + "/release_task", {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify(payload)
        });

        const j = await r.json();
        const job = j.data.task_id;

        poll(job, card);

    }catch(e){
        card.innerHTML = "❌ Failed to start generation.";
        console.error(e);
    }
}

async function poll(job, card){

    while(true){
        await sleep(2000);

        try{
            const r = await fetch(API + "/query_result", {
                method:"POST",
                headers:{ "Content-Type":"application/json" },
                body: JSON.stringify({
                    task_id_list: JSON.stringify([job])
                })
            });

            const j = await r.json();
            const data = j.data[0];

            if(data && data.status === 1){

                const arr = JSON.parse(data.result);
                const file = arr[0].file;

                card.innerHTML = `
                    <div class="badge">✅ Generated</div>
                    <audio controls src="${API + file}"></audio>
                `;
                return;
            }

        }catch(e){
            console.log("Polling...");
        }
    }
}
</script>

</body>
</html>
