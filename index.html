<!DOCTYPE html>
<html>
<head>
    <title>ACE-Step Studio</title>

    <style>
        body{
            margin:0;
            background:#0f0f0f;
            color:white;
            font-family:Arial;
            padding:30px;
        }

        h1{
            margin-bottom:20px;
        }

        textarea{
            width:100%;
            height:90px;
            background:#1a1a1a;
            border:1px solid #333;
            color:white;
            padding:10px;
            margin-bottom:10px;
        }

        button{
            padding:12px 18px;
            margin-top:10px;
            background:#4CAF50;
            border:none;
            color:white;
            cursor:pointer;
            font-weight:bold;
        }

        button:disabled{
            background:#2e7d32;
            opacity:0.6;
            cursor:not-allowed;
        }

        .toggle{
            margin:10px 0;
        }

        .card{
            margin-top:20px;
            padding:15px;
            background:#1a1a1a;
            border-radius:8px;
        }

        .skeleton{
            height:20px;
            background:linear-gradient(90deg,#222,#333,#222);
            background-size:200% 100%;
            animation:shine 1.2s infinite;
            margin-bottom:10px;
            border-radius:4px;
        }

        @keyframes shine{
            0%{background-position:200% 0;}
            100%{background-position:-200% 0;}
        }

        audio{
            width:100%;
            margin-top:10px;
        }

        .status{
            color:#aaa;
            font-size:14px;
            margin-top:10px;
        }

        .error{
            color:#ff6b6b;
        }
    </style>
</head>

<body>

<h1>🎵 ACE-Step Studio</h1>

<label>Music Description</label>
<textarea id="prompt" placeholder="Describe your music..."></textarea>

<label>Lyrics (optional)</label>
<textarea id="lyrics" placeholder="Write lyrics or leave empty..."></textarea>

<div class="toggle">
    <label>
        <input type="checkbox" id="useLLM">
        Smart Mode (AI Planning)
    </label>
</div>

<button id="genBtn" onclick="generate()">Generate</button>

<div id="results"></div>

<script>
const API = "https://emusic.emogi.space";

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function generate(){

    const prompt = document.getElementById("prompt").value.trim();
    const lyrics = document.getElementById("lyrics").value.trim();
    const useLLM = document.getElementById("useLLM").checked;
    const btn = document.getElementById("genBtn");

    if(!prompt){
        alert("Please enter a description.");
        return;
    }

    btn.disabled = true;

    const results = document.getElementById("results");

    // ===== skeleton =====
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
        <div class="skeleton" style="width:60%"></div>
        <div class="skeleton" style="width:90%"></div>
        <div class="skeleton" style="width:40%"></div>
        <div class="status">🚀 Sending job to server...</div>
    `;
    results.prepend(card);

    try{

        const r = await fetch(API + "/release_task", {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify({
                prompt: prompt,
                lyrics: lyrics,
                thinking: useLLM,
                sample_mode: useLLM,
                use_format: useLLM,
                use_cot_caption: useLLM,
                use_cot_language: useLLM
            })
        });

        const j = await r.json();
        const job = j.data.task_id;

        card.querySelector(".status").innerText = "⏳ Generating music...";

        poll(job, card);

    }catch(e){
        card.innerHTML = `<div class="error">❌ Failed to send request</div>`;
        btn.disabled = false;
    }
}

async function poll(job, card){

    while(true){

        await sleep(2000);

        try{

            const r = await fetch(API + "/query_result", {
                method:"POST",
                headers:{ "Content-Type":"application/json" },
                body: JSON.stringify({
                    task_id_list: JSON.stringify([job])
                })
            });

            const j = await r.json();
            const data = j.data[0];

            if(!data) continue;

            if(data.status === 1){
                const arr = JSON.parse(data.result);
                const file = arr[0].file;

                card.innerHTML = `
                    <b>✅ Generated</b>
                    <audio controls src="${API + file}"></audio>
                `;

                document.getElementById("genBtn").disabled = false;
                return;
            }

        }catch(e){
            card.innerHTML = `<div class="error">❌ Connection lost</div>`;
            document.getElementById("genBtn").disabled = false;
            return;
        }
    }
}
</script>

</body>
</html>
