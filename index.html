<!DOCTYPE html>
<html>
<head>
    <title>ACE-Step Studio</title>

    <style>
        body{
            margin:0;
            background:#0f0f0f;
            color:white;
            font-family:Arial;
            padding:30px;
        }

        h1{
            margin-top:0;
        }

        textarea{
            width:100%;
            height:90px;
            background:#1a1a1a;
            border:1px solid #333;
            color:white;
            padding:10px;
            margin-bottom:10px;
        }

        button{
            padding:10px 18px;
            margin-top:10px;
            background:#4CAF50;
            border:none;
            color:white;
            cursor:pointer;
        }

        .toggle{
            margin-top:10px;
        }

        /* ===== skeleton ===== */

        .card{
            margin-top:20px;
            padding:15px;
            background:#1a1a1a;
            border-radius:8px;
        }

        .skeleton{
            height:20px;
            background:linear-gradient(90deg,#222,#333,#222);
            background-size:200% 100%;
            animation:shine 1.2s infinite;
            margin-bottom:10px;
            border-radius:4px;
        }

        @keyframes shine{
            0%{background-position:200% 0;}
            100%{background-position:-200% 0;}
        }

        audio{
            width:100%;
            margin-top:10px;
        }
    </style>
</head>

<body>

<h1>🎵 ACE-Step Studio</h1>

<h3>Music Description</h3>
<textarea id="prompt" placeholder="Describe your music..."></textarea>

<h3>Lyrics (optional)</h3>
<textarea id="lyrics" placeholder="Leave empty for instrumental"></textarea>

<div class="toggle">
    <label>
        <input type="checkbox" id="useLLM">
        Use Smart Mode (LLM Planning)
    </label>
</div>

<br>
<button onclick="generate()">Generate</button>

<div id="results"></div>

<script>
const API = "https://emusic.emogi.space";

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function generate(){

    const prompt = document.getElementById("prompt").value.trim();
    const lyrics = document.getElementById("lyrics").value.trim();
    const useLLM = document.getElementById("useLLM").checked;

    const results = document.getElementById("results");

    // ===== Skeleton =====
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
        <div class="skeleton" style="width:60%"></div>
        <div class="skeleton" style="width:90%"></div>
        <div class="skeleton" style="width:40%"></div>
    `;
    results.prepend(card);

    // ===== Build request =====
    const payload = {
        prompt: prompt,
        n_samples: 1,               // FORCE ONE SONG
        thinking: useLLM,
        sample_mode: useLLM,
        use_format: useLLM,
        use_cot_caption: useLLM,
        use_cot_language: useLLM
    };

    // send lyrics only if provided
    if(lyrics.length > 0){
        payload.lyrics = lyrics;
    }

    const r = await fetch(API + "/release_task", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify(payload)
    });

    const j = await r.json();
    const job = j.data.task_id;

    poll(job, card);
}

async function poll(job, card){

    while(true){
        await sleep(2000);

        const r = await fetch(API + "/query_result", {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify({
                task_id_list: JSON.stringify([job])
            })
        });

        const j = await r.json();
        const data = j.data[0];

        if(data && data.status === 1){
            const arr = JSON.parse(data.result);
            const file = arr[0].file;

            card.innerHTML = `
                <b>✅ Generated</b>
                <audio controls src="${API + file}"></audio>
            `;
            return;
        }
    }
}
</script>

</body>
</html>
